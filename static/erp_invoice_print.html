<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>銷貨單列印</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5e5e5; color: #000;
    font-family: Arial, "Helvetica Neue", Helvetica, "MingLiU", "PMingLiU", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
    font-size: 9.5pt; }
  .inv-toolbar { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center;
    padding: 8px 16px; background: #333; color: #fff; font-size: 14px; }
  .inv-toolbar button { padding: 4px 18px; font-size: 14px; cursor: pointer; }
  .inv-toolbar a { color: #fff; }
  .inv-toolbar #print-status { color: #ffd27a; }
  #invoice-root { padding: 16px 0; }
  .inv-sheet { width: 210mm; min-height: 297mm; margin: 0 auto 16px; padding: 10mm; background: #fff;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .3); }
  .inv-company { text-align: center; }
  .inv-company-name { font-size: 18pt; }
  .inv-company-line { font-size: 9.5pt; }
  .inv-title { text-align: center; margin: 3mm 0 1mm; font-size: 15pt; }
  .inv-title span { text-decoration: underline; }
  .inv-pageno { text-align: right; font-size: 8.5pt; margin-bottom: 1mm; }
  .inv-box { border: 3px solid #000; min-height: 130mm; display: flex; flex-direction: column; }
  .inv-row-a { display: grid; grid-template-columns: 75% 25%; border-bottom: 1px solid #000; }
  .inv-row-a > div { padding: 1.5mm 2mm; }
  .inv-row-a > div + div { border-left: 1px solid #000; }
  .inv-row-b { padding: 1.5mm 2mm; border-bottom: 1px solid #000; }
  /* 欄寬對照正航實單（框寬 700 等分：QTY 0-153、DESCRIPTION 158-490、UNIT PRICE 490-600、TTL AMOUNT 600-700），
     fr 以框內寬約 697px 計，DESCRIPTION 約 342px */
  .inv-cols { display: grid; grid-template-columns: 146fr 5fr 342fr 110fr 94fr; padding: 0 2mm; }
  .inv-head { border-bottom: 1px solid #000; padding-top: 1mm; padding-bottom: .5mm; }
  .c-qty-head { text-align: left; }
  .c-qty { text-align: right; padding-right: 2.1%; }
  .c-price, .c-amt { text-align: right; }
  .c-sum { grid-column: 4 / 6; text-align: right; }
  /* 貿易條件小字置中在「UNIT PRICE」字下方（標題本身靠右） */
  .inv-price-head { display: inline-block; text-align: center; }
  .inv-term { text-align: center; font-size: 8.5pt; }
  .inv-term span { text-decoration: underline; }
  .inv-body { padding-top: 1mm; }
  .inv-line, .inv-po { font-size: 10pt; line-height: 1.35; padding-top: .4mm; padding-bottom: .4mm; }
  .inv-po .c-desc { font-weight: bold; }
  /* 品名最多 3 行，超過直接裁掉（不加省略號，同正航） */
  /* 字距 / 詞距微調讓折行同正航（ST-2026304：品名 1 折 3 行、品名 2 折 2 行），標點改正常字距後欄寬 340-344px 都會折得一樣 */
  .inv-clamp { max-height: calc(1.35em * 3); overflow: hidden; overflow-wrap: break-word; white-space: normal;
    letter-spacing: -0.07em; word-spacing: 0.05em; }
  /* 標點與中文用正常字距（"---" 才看得出是三個 -），只有英數字縮字距 */
  .inv-ls { letter-spacing: normal; }
  .inv-totals { border-top: 1px solid #000; padding-top: 1mm; margin-top: 1mm; font-size: 10pt; }
  .inv-dbl { display: inline-block; border-bottom: 3px double #000; padding-bottom: .3mm; }
  .inv-spacer { flex: 1 1 auto; min-height: 10mm; }
  .inv-sign { display: grid; grid-template-columns: 250fr 250fr 200fr; padding: 0 2mm 4mm 4.3%; }
  .inv-sign-line { display: inline-block; width: 120px; border-bottom: 1px solid #000; vertical-align: bottom; }
  .inv-error { max-width: 190mm; margin: 24px auto; padding: 12px 16px; border: 2px solid #c00; background: #fff0f0;
    color: #c00; font-size: 14px; }
  @media print {
    body { background: #fff; }
    .inv-toolbar { display: none; }
    #invoice-root { padding: 0; }
    .inv-sheet { width: 190mm; min-height: 0; margin: 0; padding: 0; box-shadow: none; page-break-after: always; }
    .inv-sheet:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
  <div class="inv-toolbar">
    <button type="button" id="btn-print">列印</button>
    <a href="#" id="lnk-close">關閉</a>
    <span id="print-status"></span>
  </div>
  <div id="invoice-root"></div>
  <script type="module" src="/static/modules/erp_invoice_print.js"></script>
</body>
</html>
