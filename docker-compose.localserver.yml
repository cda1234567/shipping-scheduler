name: dispatch-local

services:
  dispatch-scheduler:
    image: ${APP_IMAGE:-dispatch-scheduler:test}
    container_name: ${APP_CONTAINER_NAME:-dispatch-scheduler-localserver}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18765}:8765"
    env_file:
      # 正航 ERP 唯讀帳密（ERP_SQL_USER / ERP_SQL_PASSWORD）只放在本機檔案，不可提交到 git
      - path: ${ERP_ENV_FILE:-D:/secrets/shipping-erp.env}
        required: false
      # 正航採購單寫入帳密（公司1測試帳：ERP_SQL_TEST_*；公司3正式帳：ERP_SQL_WRITE_USER_CHICOMP03 等），同樣不可提交到 git
      - path: ${ERP_WRITE_ENV_FILE:-D:/secrets/shipping-erp-write.env}
        required: false
      - path: ${ERP_WRITE_ENV_FILE_COMP03:-D:/secrets/shipping-erp-comp03-write.env}
        required: false
    environment:
      ERP_SQL_SERVER: ${ERP_SQL_SERVER:-10.0.0.1}
      ERP_SQL_PORT: ${ERP_SQL_PORT:-1433}
      ERP_SQL_DATABASE: ${ERP_SQL_DATABASE:-CHIComp03}
      ERP_ST_WARE_ID: ${ERP_ST_WARE_ID:-001}
      ERP_SQL_TIMEOUT: ${ERP_SQL_TIMEOUT:-5}
      ERP_SQL_ENCRYPTION: ${ERP_SQL_ENCRYPTION:-off}
      ERP_SQL_TDS_VERSION: ${ERP_SQL_TDS_VERSION:-7.3}
      ERP_ST_AUTO_SYNC_MINUTES: ${ERP_ST_AUTO_SYNC_MINUTES:-60}
      ERP_WRITE_TARGET: ${ERP_WRITE_TARGET:-CHIComp02}
      ERP_TEST_TARGETS: ${ERP_TEST_TARGETS:-CHIComp01,CHIComp02,CHIComp13}
      # 一次收料寫入公司（空 = 沿用 ERP_WRITE_TARGET）；寫正式公司3需 ERP_RECEIVE_TARGET=CHIComp03 + ERP_ALLOW_PROD_WRITE_CHICOMP03=1
      # + ERP_SQL_WRITE_USER_CHICOMP03 / ERP_SQL_WRITE_PASSWORD_CHICOMP03（帳密放 env_file，不可提交到 git）
      ERP_RECEIVE_TARGET: ${ERP_RECEIVE_TARGET:-}
      ERP_ALLOW_PROD_WRITE_CHICOMP03: ${ERP_ALLOW_PROD_WRITE_CHICOMP03:-0}
      # 一次收料「更新平均成本」預設值（1 = 更新，0 = 不更新；畫面可逐次改）
      ERP_RECEIVE_UPDATE_COST: ${ERP_RECEIVE_UPDATE_COST:-1}
      # 採購單寄信狀態來源（automail；唯讀，本站不寄信）。AUTOMAIL_BASE_URL 設 off = 停用
      AUTOMAIL_BASE_URL: ${AUTOMAIL_BASE_URL:-https://automail.cda.tw}
      AUTOMAIL_REFRESH_SECONDS: ${AUTOMAIL_REFRESH_SECONDS:-180}
      ERP_PO_SALESMAN: ${ERP_PO_SALESMAN:-017}
      ERP_PO_MAKER: ${ERP_PO_MAKER:-Andy}
      ERP_PO_MAKER_ID: ${ERP_PO_MAKER_ID:-017}
    volumes:
      - scheduler-data:/app/data
      - D:/Download/excel:/app/user_downloads
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-dispatch-local}"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: ${WATCHTOWER_CONTAINER_NAME:-dispatch-watchtower-localserver}
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "${WATCHTOWER_DOCKER_API_VERSION:-1.44}"
    command:
      - "--label-enable"
      - "--cleanup"
      - "--rolling-restart"
      - "--scope"
      - "${WATCHTOWER_SCOPE:-dispatch-local}"
      - "--interval"
      - "${WATCHTOWER_POLL_INTERVAL:-60}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  scheduler-data:
    name: ${APP_DATA_VOLUME:-scheduler-data}
    external: true
